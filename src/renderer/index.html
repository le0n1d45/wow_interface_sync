<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>WoW Interface Sync</title>
    <style>
      :root {
        --bg: #f6f6f4; --card: #fff; --text: #1d1d1b; --muted: #6a6a64; --line: #deded8;
        --accent: #2f5fd0; --accent-text: #fff; --warn-bg: #fff4d6; --warn-text: #6b4b00;
        --ok-bg: #e4f4e6; --ok-text: #1d5a2a; --err-bg: #fde7e7; --err-text: #8a1f1f;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #16171a; --card: #1f2024; --text: #e8e8e4; --muted: #9a9a94; --line: #34353a;
          --accent: #6f95f0; --accent-text: #10131a; --warn-bg: #3a2f10; --warn-text: #f0d68a;
          --ok-bg: #16301c; --ok-text: #a6e0b0; --err-bg: #3a1a1a; --err-text: #f0aaaa;
        }
      }
      * { box-sizing: border-box; }
      body { margin: 0; padding: 16px; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif; }
      main { max-width: 760px; margin: 0 auto; display: grid; gap: 14px; }
      h1 { font-size: 20px; margin: 0 0 2px; }
      h2 { font-size: 15px; margin: 0 0 10px; }
      .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px; }
      label { display: block; margin-bottom: 10px; color: var(--muted); font-size: 12px; }
      input, textarea { display: block; width: 100%; margin-top: 3px; padding: 7px 9px; color: var(--text); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; font: inherit; }
      textarea { min-height: 54px; resize: vertical; font-family: ui-monospace, monospace; }
      .row { display: flex; gap: 8px; align-items: end; flex-wrap: wrap; }
      .row > label { flex: 1; min-width: 220px; margin-bottom: 0; }
      button { padding: 7px 14px; border-radius: 6px; border: 1px solid var(--line); background: var(--card); color: var(--text); font: inherit; cursor: pointer; }
      button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
      button:disabled { opacity: .5; cursor: not-allowed; }
      .msg { padding: 8px 10px; border-radius: 6px; margin-top: 10px; }
      .msg.warn { background: var(--warn-bg); color: var(--warn-text); }
      .msg.ok { background: var(--ok-bg); color: var(--ok-text); }
      .msg.err { background: var(--err-bg); color: var(--err-text); }
      .msg button { margin-left: 8px; }
      ul.backups { list-style: none; margin: 0; padding: 0; }
      ul.backups li { display: flex; justify-content: space-between; gap: 10px; align-items: center; padding: 8px 0; border-top: 1px solid var(--line); }
      ul.backups li:first-child { border-top: 0; }
      .muted { color: var(--muted); font-size: 12px; }
      .files { white-space: pre-wrap; word-break: break-all; margin-top: 4px; }
      details summary { cursor: pointer; color: var(--muted); font-size: 12px; }
    </style>
  </head>
  <body>
    <main id="app"></main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
