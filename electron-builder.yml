appId: io.github.le0n1d45.wow-interface-sync
productName: WoW Interface Sync
directories:
  output: dist
files:
  - out/**
  - package.json
asar: true
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
win:
  target:
    - target: portable
      arch: [x64]
linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Utility
mac:
  target:
    - target: zip
      arch: [x64, arm64]
  identity: null
